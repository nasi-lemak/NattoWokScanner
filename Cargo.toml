[package]
name = "nattowok"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Privacy-first network scanner that explains what it finds: device discovery, security advice, and an internet doctor."
license = "MIT"
readme = "README.md"
default-run = "nattowok"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
getrandom = "0.3"
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

[features]
default = ["tls"]
# HTTPS features: the speed test and downloading vendor-list updates.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
